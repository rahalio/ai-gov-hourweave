openapi: 3.0.3
info:
  title: Hourweave
  version: 0.1.0
  description: >-
    Civil-service work redesign API that inventories tasks, scores Three-Vs opportunities,
    declares Relieve/Split-up/Replace/Augment modes, and banks freed hours to mission work.
  x-product-slug: ai-gov-hourweave
  x-source: ai-in-gov/deloitte-DUP_ai-augmented-government/
servers:
  - url: https://api.example.com
tags:
  - name: Inventories
    description: Job families and task activities
  - name: Opportunities
    description: Three-Vs opportunity scoring
  - name: Modes
    description: Four automation mode choices
  - name: HourBanks
    description: Freed hour banking and redeployment
  - name: Waves
    description: Redesign waves and consultation
  - name: Recommendations
    description: Augment recommendations for human acceptance
  - name: Governance
    description: Strategy election, KPIs, rollback
paths:
  /v1/job-families:
    get:
      operationId: listJobFamilies
      tags: [Inventories]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Job families
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeJobFamily"
    post:
      operationId: createJobFamily
      tags: [Inventories]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobFamilyCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeJobFamily"
  /v1/job-families/{jobFamilyId}/tasks:
    parameters:
      - $ref: "#/components/parameters/JobFamilyId"
    get:
      operationId: listTaskActivities
      tags: [Inventories]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Task activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTaskActivity"
    post:
      operationId: upsertTaskActivity
      tags: [Inventories]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActivity"
      responses:
        "201":
          description: Task upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTaskActivity"
  /v1/opportunities:
    get:
      operationId: listOpportunities
      tags: [Opportunities]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: verdict
          in: query
          schema:
            type: string
            enum: [viable, valuable, vital, rejected]
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeOpportunityScore"
    post:
      operationId: scoreOpportunity
      tags: [Opportunities]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityScoreCreate"
      responses:
        "201":
          description: Scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOpportunityScore"
  /v1/mode-choices:
    get:
      operationId: listModeChoices
      tags: [Modes]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Mode choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAutomationModeChoice"
    post:
      operationId: declareModeChoice
      tags: [Modes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationModeChoiceCreate"
      responses:
        "201":
          description: Mode declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAutomationModeChoice"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/mode-choices/{choiceId}/impact-assessment:
    parameters:
      - $ref: "#/components/parameters/ChoiceId"
    post:
      operationId: submitEmployeeImpactAssessment
      tags: [Modes]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeImpactAssessment"
      responses:
        "201":
          description: Impact assessment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEmployeeImpactAssessment"
  /v1/hour-banks:
    get:
      operationId: listHourBanks
      tags: [HourBanks]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Hour banks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeHourBank"
    post:
      operationId: createHourBank
      tags: [HourBanks]
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HourBankCreate"
      responses:
        "201":
          description: Hour bank created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHourBank"
  /v1/hour-banks/{bankId}/assignments:
    parameters:
      - $ref: "#/components/parameters/BankId"
    post:
      operationId: assignBankedHours
      tags: [HourBanks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receivingActivityId, hours]
              properties:
                receivingActivityId: { type: string }
                hours: { type: number }
      responses:
        "200":
          description: Hours assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeHourBank"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/receiving-activities:
    post:
      operationId: createReceivingActivity
      tags: [HourBanks]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivingActivity"
      responses:
        "201":
          description: Receiving activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeReceivingActivity"
  /v1/waves:
    get:
      operationId: listRedesignWaves
      tags: [Waves]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Waves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeRedesignWave"
    post:
      operationId: createRedesignWave
      tags: [Waves]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedesignWaveCreate"
      responses:
        "201":
          description: Wave created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRedesignWave"
  /v1/waves/{waveId}/consultation:
    parameters:
      - $ref: "#/components/parameters/WaveId"
    post:
      operationId: recordConsultation
      tags: [Waves]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultationRecord"
      responses:
        "201":
          description: Consultation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeConsultationRecord"
  /v1/recommendations:
    get:
      operationId: listAugmentRecommendations
      tags: [Recommendations]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAugmentRecommendation"
    post:
      operationId: createAugmentRecommendation
      tags: [Recommendations]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AugmentRecommendationCreate"
      responses:
        "201":
          description: Recommendation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAugmentRecommendation"
  /v1/recommendations/{recommendationId}/decision:
    parameters:
      - $ref: "#/components/parameters/RecommendationId"
    post:
      operationId: decideAugmentRecommendation
      tags: [Recommendations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, decidedBy]
              properties:
                status:
                  type: string
                  enum: [accepted, rejected]
                decidedBy: { type: string }
                rationale: { type: string }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAugmentRecommendation"
  /v1/governance/strategy-elections:
    post:
      operationId: electStrategy
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyElection"
      responses:
        "201":
          description: Strategy elected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeStrategyElection"
  /v1/governance/kpi-baselines:
    post:
      operationId: createKpiBaseline
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KpiBaseline"
      responses:
        "201":
          description: Baseline stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeKpiBaseline"
  /v1/governance/rollbacks:
    post:
      operationId: executeRollback
      tags: [Governance]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackEventCreate"
      responses:
        "202":
          description: Rollback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeRollbackEvent"
components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    JobFamilyId:
      name: jobFamilyId
      in: path
      required: true
      schema: { type: string }
    ChoiceId:
      name: choiceId
      in: path
      required: true
      schema: { type: string }
    BankId:
      name: bankId
      in: path
      required: true
      schema: { type: string }
    WaveId:
      name: waveId
      in: path
      required: true
      schema: { type: string }
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Agency:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    JobFamily:
      type: object
      required: [id, agencyId, title]
      properties:
        id: { type: string }
        agencyId: { type: string }
        title: { type: string }
        headcount: { type: integer }
    JobFamilyCreate:
      type: object
      required: [agencyId, title]
      properties:
        agencyId: { type: string }
        title: { type: string }
        headcount: { type: integer }
    TaskActivity:
      type: object
      required: [id, jobFamilyId, name, timeSharePercent, susceptibility]
      properties:
        id: { type: string }
        jobFamilyId: { type: string }
        name: { type: string }
        timeSharePercent: { type: number }
        susceptibility: { type: number, minimum: 0, maximum: 1 }
        sourceMethod:
          type: string
          enum: [onet_style, agency_time_study, supervisor_estimate]
    OpportunityScore:
      type: object
      required: [id, taskActivityId, verdict]
      properties:
        id: { type: string }
        taskActivityId: { type: string }
        viable: { type: boolean }
        valuable: { type: boolean }
        vital: { type: boolean }
        verdict:
          type: string
          enum: [viable, valuable, vital, rejected]
        rejectReason: { type: string }
    OpportunityScoreCreate:
      type: object
      required: [taskActivityId, viable, valuable, vital, verdict]
      properties:
        taskActivityId: { type: string }
        viable: { type: boolean }
        valuable: { type: boolean }
        vital: { type: boolean }
        verdict:
          type: string
          enum: [viable, valuable, vital, rejected]
        rejectReason: { type: string }
    AutomationModeChoice:
      type: object
      required: [id, opportunityId, mode, ownerId]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        mode:
          type: string
          enum: [relieve, split_up, replace, augment]
        rationale: { type: string }
        ownerId: { type: string }
        declaredAt: { type: string, format: date-time }
    AutomationModeChoiceCreate:
      type: object
      required: [opportunityId, mode, ownerId]
      properties:
        opportunityId: { type: string }
        mode:
          type: string
          enum: [relieve, split_up, replace, augment]
        rationale: { type: string }
        ownerId: { type: string }
    HourBank:
      type: object
      required: [id, modeChoiceId, estimatedHours, measuredHours]
      properties:
        id: { type: string }
        modeChoiceId: { type: string }
        estimatedHours: { type: number }
        measuredHours: { type: number }
        assignedHours: { type: number }
        period: { type: string }
    HourBankCreate:
      type: object
      required: [modeChoiceId, estimatedHours, period]
      properties:
        modeChoiceId: { type: string }
        estimatedHours: { type: number }
        measuredHours: { type: number }
        period: { type: string }
    ReceivingActivity:
      type: object
      required: [id, name, missionOutcome]
      properties:
        id: { type: string }
        name: { type: string }
        missionOutcome: { type: string }
        backlogQueueId: { type: string }
    RedesignWave:
      type: object
      required: [id, name, status, modeChoiceId]
      properties:
        id: { type: string }
        name: { type: string }
        modeChoiceId: { type: string }
        status:
          type: string
          enum: [planned, consulting, live, paused, closed]
    RedesignWaveCreate:
      type: object
      required: [name, modeChoiceId]
      properties:
        name: { type: string }
        modeChoiceId: { type: string }
    ConsultationRecord:
      type: object
      required: [id, waveId, consultedParty, outcome]
      properties:
        id: { type: string }
        waveId: { type: string }
        consultedParty: { type: string }
        outcome: { type: string }
        recordedAt: { type: string, format: date-time }
    StrategyElection:
      type: object
      required: [id, agencyId, strategy]
      properties:
        id: { type: string }
        agencyId: { type: string }
        strategy:
          type: string
          enum: [cost, value, blend]
        disclosedToFinance: { type: boolean }
        disclosedToChco: { type: boolean }
    KpiBaseline:
      type: object
      required: [id, waveId, metricName, baselineValue]
      properties:
        id: { type: string }
        waveId: { type: string }
        metricName: { type: string }
        baselineValue: { type: number }
        unit: { type: string }
    KpiResult:
      type: object
      required: [id, baselineId, resultValue]
      properties:
        id: { type: string }
        baselineId: { type: string }
        resultValue: { type: number }
        measuredAt: { type: string, format: date-time }
    AugmentRecommendation:
      type: object
      required: [id, subjectRef, recommendationText, confidence, status]
      properties:
        id: { type: string }
        subjectRef: { type: string }
        recommendationText: { type: string }
        evidenceCitations:
          type: array
          items: { type: string }
        confidence: { type: number }
        status:
          type: string
          enum: [pending, accepted, rejected]
        decidedBy: { type: string }
    AugmentRecommendationCreate:
      type: object
      required: [subjectRef, recommendationText, confidence]
      properties:
        subjectRef: { type: string }
        recommendationText: { type: string }
        evidenceCitations:
          type: array
          items: { type: string }
        confidence: { type: number }
    RollbackEvent:
      type: object
      required: [id, waveId, reason, status]
      properties:
        id: { type: string }
        waveId: { type: string }
        reason: { type: string }
        status:
          type: string
          enum: [accepted, completed]
        triggeredBy: { type: string }
    RollbackEventCreate:
      type: object
      required: [waveId, reason, triggeredBy]
      properties:
        waveId: { type: string }
        reason: { type: string }
        triggeredBy: { type: string }
    EmployeeImpactAssessment:
      type: object
      required: [id, modeChoiceId, positionsAffected, consultationRequired]
      properties:
        id: { type: string }
        modeChoiceId: { type: string }
        positionsAffected: { type: integer }
        consultationRequired: { type: boolean }
        residualExceptionHandling: { type: string }
        cleared: { type: boolean }

    DataEnvelopeJobFamily:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/JobFamily"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeJobFamily:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/JobFamily"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeTaskActivity:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/TaskActivity"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeTaskActivity:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TaskActivity"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeOpportunityScore:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/OpportunityScore"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeOpportunityScore:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OpportunityScore"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeAutomationModeChoice:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AutomationModeChoice"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeAutomationModeChoice:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AutomationModeChoice"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeHourBank:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/HourBank"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeHourBank:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/HourBank"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeReceivingActivity:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ReceivingActivity"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeReceivingActivity:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReceivingActivity"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeRedesignWave:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/RedesignWave"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeRedesignWave:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/RedesignWave"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeConsultationRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ConsultationRecord"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeConsultationRecord:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ConsultationRecord"
            nextCursor: { type: string }
        meta:
          $ref: "#/components/schemas/ResponseMeta"


    DataEnvelopeAugmentRecommendation:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AugmentRecommendation"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeAugmentRecommendation:
      type: object
      required: [data, meta]
      properties:
